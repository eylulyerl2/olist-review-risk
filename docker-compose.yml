services:
  db:
    image: postgres:16
    container_name: olist-db
    restart: unless-stopped
    env_file: .env
    ports:
      - "5434:5432"
    volumes:
      - olist_pgdata:/var/lib/postgresql/data
      - ./data/raw:/data/raw:ro
      - ./sql:/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  olist_pgdata: